<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script
  crossorigin="anonymous"
  async
  src="https://static.coinstats.app/widgets/v6/coin-price.js">
</script>

<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #1C1B1B;
  }

  .widget-container {
    width: 100%;
    height: 100%;
    min-width: 0;
    min-height: 0;
    display: flex;
    overflow: hidden;
    background: #1C1B1B;
  }

  cs-coin-price {
    display: block !important;
    width: 100% !important;
    height: 100% !important;
    min-width: 0 !important;
    min-height: 0 !important;
  }
</style>
</head>

<body>

<div class="widget-container">

  <cs-coin-price
    background="#1C1B1B"
    text-color="#FFFFFF"
    status-up-color="#6CCF59"
    status-down-color="#FF3535"
    border-color="#FFFFFF26"
    rank-text-color="#FFA959"
    theme="dark"
    coin="bitcoin"
    currency="USD"
    variant="small">
  </cs-coin-price>

</div>

</body>
</html>
